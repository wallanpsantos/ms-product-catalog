name: Build and Test - Java CI with Gradle

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ── Wrapper Validation ──────────────────────────────────────────
  # Validates the gradle-wrapper.jar checksum against the official
  # Gradle registry BEFORE any code is compiled or executed.
  # This prevents supply-chain attacks via a tampered wrapper JAR.
  validate_wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper JAR checksum
        uses: gradle/actions/wrapper-validation@v5

  # ── Build & Test ────────────────────────────────────────────────
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate_wrapper  # Only runs if the wrapper JAR is valid

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Replaces the manual cache step — handles ~/.gradle/caches,
      # ~/.gradle/wrapper, and the build-scan token automatically.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # `build` already compiles, runs tests (with JaCoCo), and assembles the JAR.
      # `-x nativeCompile` skips the slow GraalVM AOT step — not needed in CI.
      - name: Build with Gradle
        run: ./gradlew clean build -x nativeCompile

      # Upload the JaCoCo XML report so it can be consumed by coverage tools
      # (e.g. Codecov, SonarCloud) or inspected manually.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 7

      # Upload only the application JAR, excluding plain/sources jars.
      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: jar-files
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 7

  # ── Dependency Graph ────────────────────────────────────────────
  # Generates and submits a dependency graph to enable Dependabot Alerts.
  # Runs only on pushes to the default branches (not on PRs) to avoid
  # submitting duplicate graphs for the same code.
  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    needs: validate_wrapper  # Only runs if the wrapper JAR is valid
    if: github.event_name == 'push'

    permissions:
      contents: write  # Required to submit the dependency graph

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v5