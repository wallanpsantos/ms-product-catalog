  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "5"
  #   security_opt:
  #     - no-new-privileges:true
  #   networks:
  #     - product-catalog-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  product-catalog-network:
    driver: bridge