services:

  # ── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:18.3
    container_name: ms-product-catalog-postgres
    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${DB_NAME:-db-product-catalog}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d ${DB_NAME:-db-product-catalog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    networks:
      - product-catalog-network

  # ── pgAdmin (Dev GUI) ────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ms-product-catalog-pgadmin
    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change-me-in-production}

    depends_on:
      postgres:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    security_opt:
      - no-new-privileges:true

    networks:
      - product-catalog-network

  # ── Application (uncomment to run the full stack locally) ──────
