# ── Gradle Configuration Cache ──────────────────────────────────────────────
# Habilita o Configuration Cache persistentemente (Gradle 9.x preferred mode)
org.gradle.configuration-cache=true
#
# Ativa paralelismo no store/load do cache (melhora ~50% em projetos grandes)
# Desative se o build apresentar comportamentos inesperados
org.gradle.configuration-cache.parallel=true
#
# ── Build Cache ──────────────────────────────────────────────────────────────
# Reutiliza outputs de builds anteriores (complementar ao CC)
org.gradle.caching=true
#
# ── Performance geral ────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true


