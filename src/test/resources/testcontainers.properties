# Testcontainers Configuration
# Para desenvolvimento local no Windows com Podman, descomente as linhas abaixo
# ou, preferencialmente, configure via variáveis de ambiente (ex: DOCKER_HOST).
# Em ambientes Linux / CI (GitHub Actions), essas configurações quebram a execução.

# ryuk.disabled=true
# docker.host=npipe:////./pipe/docker_engine
ryuk.disabled=true
testcontainers.reuse.enable=true